name: Build zlib 1.2.13 Static Libs for OpenToonz (MSVC Direct)

on:
  workflow_dispatch:
  push:
    branches: '**'

jobs:
  build:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    # Passo 1: Verificar arquivos no diretório
    - name: List files in the directory
      run: dir contrib\vstudio\vc14

    # Passo 2: Setup MSVC
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # Passo 3: Retarget Solution para v142 (Visual Studio 2019)
    - name: Retarget Solution to v142
      working-directory: contrib\vstudio\vc14
      run: |
        msbuild zlibvc.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142
        msbuild zlibvc.sln /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v142

    # Passo 4: Build Release Static Lib (/MT) sem geração de debug
    - name: Build Release Static Lib (/MT) sem debug
      shell: cmd
      working-directory: contrib\vstudio\vc14
      run: |
        msbuild zlibvc.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142 /p:RuntimeLibrary=MultiThreaded /p:GenerateDebugInformation=false
        if not exist x64\ZlibStatRelease\zlibstat.lib (
          echo ERROR: zlibstat.lib not found!
          exit 1
        )
        copy x64\ZlibStatRelease\zlibstat.lib ..\..\..\zlib-1.2.13_2019_64.lib

    # Passo 5: Build Debug Static Lib (/MTd) sem geração de debug
    - name: Build Debug Static Lib (/MTd) sem debug
      shell: cmd
      working-directory: contrib\vstudio\vc14
      run: |
        msbuild zlibvc.sln /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v142 /p:RuntimeLibrary=MultiThreadedDebug /p:GenerateDebugInformation=false
        if not exist x64\ZlibStatDebug\zlibstat.lib (
          echo ERROR: zlibstat.lib not found!
          exit 1
        )
        copy x64\ZlibStatDebug\zlibstat.lib ..\..\..\zlib-1.2.13_2019_64d.lib

    # Passo 6: Upload dos arquivos gerados
    - name: Upload static libs
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-libs-mt
        path: |
          zlib-1.2.13_2019_64.lib
          zlib-1.2.13_2019_64d.lib
        retention-days: 5
