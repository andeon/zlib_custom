name: Build zlib 1.2.13 Static Libs for OpenToonz

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.7'

    - name: Configure CMake
      shell: bash
      run: |
        # Force static lib with MD runtime
        cmake -S . -B build -G "Visual Studio 16 2019" -A x64 \
          -DZLIB_BUILD_EXAMPLES=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreadedDLL" \
          -DCMAKE_DEBUG_POSTFIX="d"

    - name: Build Release
      shell: cmd
      working-directory: ./build
      run: |
        # Explicitly set runtime library in MSBuild
        msbuild zlib.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeLibrary=MultiThreadedDLL
        if not exist Release\zlibstatic.lib (
          echo ERROR: Release static lib not found!
          exit 1
        )
        copy Release\zlibstatic.lib zlib-1.2.13_2019_64_MD.lib

    - name: Build Debug
      shell: cmd
      working-directory: ./build
      run: |
        # Explicitly set debug runtime library
        msbuild zlib.sln /p:Configuration=Debug /p:Platform=x64 /p:RuntimeLibrary=MultiThreadedDebugDLL
        if not exist Debug\zlibstaticd.lib (
          echo ERROR: Debug static lib not found!
          exit 1
        )
        copy Debug\zlibstaticd.lib zlib-1.2.13_2019_64_MDd.lib

    - name: Verify Runtime Linkage
      shell: cmd
      working-directory: ./build
      run: |
        echo Verifying Release lib...
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64_MD.lib | findstr /i "DLL" || (
          echo ERROR: Release lib not built with /MD!
          dumpbin /DIRECTIVES zlib-1.2.13_2019_64_MD.lib | findstr /i "Runtime"
          exit 1
        )

        echo Verifying Debug lib...
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64_MDd.lib | findstr /i "DebugDLL" || (
          echo ERROR: Debug lib not built with /MDd!
          dumpbin /DIRECTIVES zlib-1.2.13_2019_64_MDd.lib | findstr /i "Runtime"
          exit 1
        )

        echo Both libraries verified with correct DLL runtime linkage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-MD-runtime
        path: |
          build/zlib-1.2.13_2019_64_MD.lib
          build/zlib-1.2.13_2019_64_MDd.lib
          build/zlib.sln
          build/zlib.vcxproj
        retention-days: 5
