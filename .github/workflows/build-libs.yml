name: Build zlib 1.2.13 Static Libs for OpenToonz

on:
  workflow_dispatch:
  push:
    branches: '**'

jobs:
  build:
    runs-on: windows-2019
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2.0.2

    - name: Generate Visual Studio project with CMake
      run: |
        cmake -S . -B build -G "Visual Studio 16 2019" -A x64 -DZLIB_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF

    - name: Build Release Static Lib (/MD)
      run: |
        cmake --build build --config Release
        if exist build\Release\zlibstatic.lib ren build\Release\zlibstatic.lib zlib-1.2.13_2019_64.lib

    - name: Build Debug Static Lib (/MDd)
      run: |
        cmake --build build --config Debug
        if exist build\Debug\zlibstatic.lib ren build\Debug\zlibstatic.lib zlib-1.2.13_2019_64d.lib

    - name: Verify static libs
      run: |
        dumpbin /HEADERS build\zlib-1.2.13_2019_64.lib | find "machine"
        dumpbin /HEADERS build\zlib-1.2.13_2019_64d.lib | find "machine"
        dumpbin /DIRECTIVES build\zlib-1.2.13_2019_64.lib | find "Runtime"
        dumpbin /DIRECTIVES build\zlib-1.2.13_2019_64d.lib | find "Runtime"
        dir build\*.lib
        if not exist build\zlib-1.2.13_2019_64.lib exit 1
        if not exist build\zlib-1.2.13_2019_64d.lib exit 1

    - name: Upload static libs
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-libs-md
        path: |
          build/zlib-1.2.13_2019_64.lib
          build/zlib-1.2.13_2019_64d.lib
        retention-days: 5

    - name: Upload Visual Studio project files
      uses: actions/upload-artifact@v4
      with:
        name: zlib-vs-project
        path: |
          build/*.sln
          build/*.vcxproj
          build/*.vcxproj.filters
        retention-days: 5
