name: Build zlib 1.2.13 Static Libs for OpenToonz

on:
  workflow_dispatch:
  push:
    branches: '**'

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install modern CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.7'

    - name: Show CMake version
      run: cmake --version

    - name: Create build directory
      shell: bash
      run: mkdir -p build

    - name: Configure CMake project
      shell: bash
      run: |
        cmake -S . -B build -G "Visual Studio 16 2019" -A x64 \
          -DZLIB_BUILD_EXAMPLES=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

    - name: Ensure RuntimeLibrary is correct in project
      shell: bash
      working-directory: ./build
      run: |
        grep -q "<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>" zlib.vcxproj || (echo "ERROR: Release lib is not using /MD!" && exit 1)
        grep -q "<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>" zlib.vcxproj || (echo "ERROR: Debug lib is not using /MDd!" && exit 1)

    - name: Build Release Static Lib (/MD)
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Release /p:Platform=x64
        if not exist Release\zlibstatic.lib (
          echo ERROR: zlibstatic.lib not found!
          exit 1
        )
        copy Release\zlibstatic.lib zlib-1.2.13_2019_64.lib

    - name: Build Debug Static Lib (/MDd)
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Debug /p:Platform=x64
        if not exist Debug\zlibstaticd.lib (
          echo ERROR: zlibstaticd.lib not found!
          exit 1
        )
        copy Debug\zlibstaticd.lib zlib-1.2.13_2019_64d.lib

    - name: Verify Output Libraries
      shell: cmd
      working-directory: ./build
      run: |
        dir *.lib
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64.lib | findstr /i "Runtime"
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64d.lib | findstr /i "Runtime"
        dumpbin /HEADERS zlib-1.2.13_2019_64.lib | findstr "machine (x64)" >nul || (echo "ERROR: Not x64 Release lib" && exit 1)
        dumpbin /HEADERS zlib-1.2.13_2019_64d.lib | findstr "machine (x64)" >nul || (echo "ERROR: Not x64 Debug lib" && exit 1)

    - name: Upload zlib static libraries
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-libs-md
        path: |
          build/zlib-1.2.13_2019_64.lib
          build/zlib-1.2.13_2019_64d.lib

    - name: Upload zlib project files
      uses: actions/upload-artifact@v4
      with:
        name: zlib-vs2019-project
        path: |
          build/zlib.sln
          build/zlib.vcxproj
        retention-days: 7
