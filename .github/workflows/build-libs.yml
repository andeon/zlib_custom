name: Build zlib 1.2.13 Static Libs for OpenToonz

on:
  workflow_dispatch:
  push:
    branches: '**'

jobs:
  build:
    runs-on: windows-2019
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CMake
      uses: actions/setup-cmake@v3

    - name: Prepare build environment
      shell: bash
      run: |
        mkdir -p build
        cp *.c *.h win32/Makefile.msc build/
        
    - name: Generate Visual Studio project with CMake
      shell: bash
      run: |
        cmake -G "Visual Studio 16 2019" -A x64 -S . -B build

    - name: Build Release Static Lib (/MD) using MSBuild
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Release /p:Platform=x64
        if exist zlib.lib ren zlib.lib zlib-1.2.13_2019_64.lib
        
    - name: Build Debug Static Lib (/MDd) using MSBuild
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Debug /p:Platform=x64
        if exist zlib.lib ren zlib.lib zlib-1.2.13_2019_64d.lib
        
    - name: Verify static libs
      shell: cmd
      working-directory: ./build
      run: |
        dumpbin /HEADERS zlib-1.2.13_2019_64.lib | find "machine"
        dumpbin /HEADERS zlib-1.2.13_2019_64d.lib | find "machine"
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64.lib | find "Runtime"
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64d.lib | find "Runtime"
        dir *.lib
        if not exist zlib-1.2.13_2019_64.lib exit 1
        if not exist zlib-1.2.13_2019_64d.lib exit 1

    - name: Upload static libs
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-libs-md
        path: |
          build/zlib-1.2.13_2019_64.lib
          build/zlib-1.2.13_2019_64d.lib
        retention-days: 5

    - name: Upload zlib solution and project files
      uses: actions/upload-artifact@v4
      with:
        name: zlib-project-files
        path: |
          build/zlib.sln
          build/zlib.vcxproj
        retention-days: 5
