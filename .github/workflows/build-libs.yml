name: Build zlib 1.2.13 Static Libs for OpenToonz

on:
  workflow_dispatch:
  push:
    branches: '**'

jobs:
  build:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install modern CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.7'

    - name: Check CMake version
      run: cmake --version

    - name: Prepare build environment
      shell: bash
      run: |
        mkdir -p build

    - name: Configure CMake project
      shell: bash
      run: |
        cmake -S . -B build -G "Visual Studio 16 2019" -A x64 -DZLIB_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF

    - name: Build Release Static Lib (/MD)
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Release /p:Platform=x64
        if not exist Release\zlibstatic.lib (
          echo ERROR: Release\zlibstatic.lib not found!
          exit 1
        )
        copy Release\zlibstatic.lib zlib-1.2.13_2019_64.lib

    - name: Build Debug Static Lib (/MDd)
      shell: cmd
      working-directory: ./build
      run: |
        msbuild zlib.sln /p:Configuration=Debug /p:Platform=x64
        if not exist Debug\zlibstatic.lib (
          echo ERROR: Debug\zlibstatic.lib not found!
          exit 1
        )
        copy Debug\zlibstatic.lib zlib-1.2.13_2019_64d.lib

    - name: Verify static libs
      shell: cmd
      working-directory: ./build
      run: |
        dir *.lib
        dumpbin /HEADERS zlib-1.2.13_2019_64.lib | find "machine"
        dumpbin /HEADERS zlib-1.2.13_2019_64d.lib | find "machine"
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64.lib | find "Runtime"
        dumpbin /DIRECTIVES zlib-1.2.13_2019_64d.lib | find "Runtime"
        if not exist zlib-1.2.13_2019_64.lib exit 1
        if not exist zlib-1.2.13_2019_64d.lib exit 1

    - name: Upload static libs
      uses: actions/upload-artifact@v4
      with:
        name: zlib-static-libs-md
        path: |
          build/zlib-1.2.13_2019_64.lib
          build/zlib-1.2.13_2019_64d.lib
        retention-days: 5

    - name: Upload zlib solution and project files
      uses: actions/upload-artifact@v4
      with:
        name: zlib-project-files
        path: |
          build/zlib.sln
          build/zlib.vcxproj
        retention-days: 5
